<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Follow Us on Instagram</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .profile-card {
            background: #ffffff;
            width: 90%;
            max-width: 400px;
            padding: 40px 20px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        .profile-img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid transparent;
            background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%) border-box;
            padding: 3px;
            margin-bottom: 20px;
        }
        .brand-name {
            font-size: 24px;
            color: #333;
            margin-bottom: 10px;
            font-weight: 700;
        }
        .description {
            font-size: 15px;
            color: #666;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        .follow-btn {
            display: inline-block;
            background: linear-gradient(45deg, #f09433, #dc2743, #bc1888);
            color: white;
            text-decoration: none;
            padding: 14px 40px;
            border-radius: 30px;
            font-size: 18px;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(220, 39, 67, 0.3);
        }
        .follow-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(220, 39, 67, 0.4);
        }
        .offer-tag {
            margin-top: 25px;
            font-size: 13px;
            color: #28a745;
            background: #e8f5e9;
            padding: 8px 15px;
            border-radius: 15px;
            display: inline-block;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="profile-card">
        <!-- உங்களின் 3D லோகோ அல்லது இமேஜ் லிங்கை இங்கே மாற்றவும் -->
        <img src="YOUR_LOGO_URL_HERE.jpg" alt="Profile Logo" class="profile-img">
        
        <h1 class="brand-name">Digital Print Portal</h1>
        
        <p class="description">
            எங்களின் புதிய சேவைகள், ஆஃபர்கள் மற்றும் முக்கிய அப்டேட்களை உடனுக்குடன் தெரிந்துகொள்ள இன்ஸ்டாகிராமில் எங்களை பின்தொடருங்கள்!
        </p>
        
        <!-- உங்களின் இன்ஸ்டாகிராம் லிங்கை href-ல் மாற்றவும் -->
        <a href="https://instagram.com/sk_Xerox_Shop" class="follow-btn" target="_blank">
            Follow on Instagram
        </a>

        <div class="offer-tag">
            ✨ Follow செய்து சிறப்பு சலுகைகளை பெறுங்கள்!
        </div>
    </div>

</body>
</html>
